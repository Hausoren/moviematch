<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MovieMatch</title>
    <meta name="referrer" content="no-referrer">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            touch-action: none; 
            overflow: hidden; 
            height: 100dvh; 
            max-height: 100dvh; 
        }
        .card { transition: transform 0.22s ease-out, opacity 0.22s ease-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Безотказный альбомный поворот без вылета за экран */
        .cinema-landscape {
            position: fixed !important;
            width: 100dvh !important;
            height: 100dvw !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg) !important;
            z-index: 99999 !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-white h-[100dvh] max-h-[100dvh] flex flex-col justify-between p-3 select-none font-sans overflow-hidden">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="flex-shrink-0 w-full max-w-sm mx-auto flex flex-col gap-2 pt-1 pb-2 border-b border-white/10">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
                <span class="text-2xl">🍿</span>
                <span class="font-black text-base tracking-tight text-white">MovieMatch</span>
            </div>
            
            <!-- Мой список (Соло) -->
            <button onclick="openSoloWatchlist()" id="soloBtn" class="text-xs font-bold px-3 py-1.5 rounded-2xl bg-slate-800 border border-white/10 shadow-sm text-slate-200 active:scale-95 transition flex items-center gap-1.5">
                <span>⭐ Мой список:</span>
                <span id="savedCountBadge" class="bg-emerald-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">0</span>
            </button>

            <!-- Позвать пару прямо в Telegram -->
            <button onclick="shareRoom()" id="inviteBtn" class="text-xs font-bold text-white bg-indigo-600 px-3.5 py-1.5 rounded-2xl shadow-md shadow-indigo-500/30 active:scale-95 transition">
                + Вдвоём
            </button>
        </div>

        <!-- Кнопки жанров -->
        <div class="flex items-center gap-2 overflow-x-auto py-1 text-xs no-scrollbar">
            <button onclick="changeGenre('')" class="genre-btn px-4 py-2 rounded-2xl bg-white text-slate-950 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="">🎲 Все фильмы</button>
            <button onclick="changeGenre('10749')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="10749">❤️ Про любовь</button>
            <button onclick="changeGenre('35')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="35">😂 Комедии</button>
            <button onclick="changeGenre('878')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="878">🚀 Фантастика</button>
            <button onclick="changeGenre('53')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="53">🔪 Триллеры</button>
            <button onclick="changeGenre('28')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="28">💥 Боевики</button>
            <button onclick="changeGenre('18')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="18">🎭 Драмы</button>
            <button onclick="changeGenre('27')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-800 border border-white/10 text-slate-300 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="27">👻 Ужасы</button>
        </div>
    </header>

    <!-- СТЕК КАРТОЧЕК -->
    <main class="flex-grow w-full max-w-sm mx-auto relative flex items-center justify-center min-h-0 my-1">
        <div id="cardStack" class="relative w-full h-full max-h-[490px]">
            <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-xs">
                <span class="text-3xl mb-2 animate-bounce">🍿</span>
                <span>Загружаем фильмы...</span>
            </div>
        </div>
    </main>

    <!-- КНОПКИ СВАЙПОВ -->
    <footer class="flex-shrink-0 w-full max-w-sm mx-auto flex items-center justify-center gap-8 py-2">
        <button onclick="handleSwipe('left')" class="w-16 h-16 rounded-full bg-slate-800 border-2 border-rose-500/40 text-rose-400 flex items-center justify-center text-3xl shadow-xl active:scale-90 transition">
            ✕
        </button>
        <button onclick="toggleDescription()" class="w-12 h-12 rounded-full bg-slate-800 border border-white/10 text-slate-300 flex items-center justify-center text-lg shadow-md active:scale-90 transition">
            ℹ️
        </button>
        <button onclick="handleSwipe('right')" class="w-16 h-16 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center text-3xl shadow-xl shadow-emerald-500/30 active:scale-90 transition">
            ❤️
        </button>
    </footer>

    <!-- ЭКРАН СОЛО-РЕЖИМА -->
    <div id="watchlistModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-40 hidden flex flex-col justify-end">
        <div class="bg-slate-900 rounded-t-3xl p-5 max-h-[85vh] flex flex-col shadow-2xl border-t border-white/10">
            <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
                <div>
                    <h3 class="text-base font-black text-white">⭐ Мой список фильмов</h3>
                    <p class="text-[11px] text-slate-400">Сохранённые вами фильмы</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearAllWatchlist()" class="px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold border border-rose-500/20 active:scale-95">
                        Очистить всё 🗑️
                    </button>
                    <button onclick="closeSoloWatchlist()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 text-sm font-bold">✕</button>
                </div>
            </div>
            
            <div id="watchlistContent" class="overflow-y-auto space-y-2.5 flex-grow no-scrollbar pr-1"></div>
        </div>
    </div>

    <!-- ЭКРАН СОВПАДЕНИЯ (MATCH) -->
    <div id="matchModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-6 text-center text-white">
        <div class="text-5xl mb-1 animate-bounce">🎉</div>
        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 mb-1">
            IT’S A MATCH!
        </h2>
        <p class="text-xs text-slate-300 mb-3">Вы оба выбрали этот фильм:</p>

        <div class="w-40 h-60 rounded-2xl overflow-hidden shadow-2xl mb-3 border border-white/20 bg-slate-900">
            <img id="matchPoster" src="" class="w-full h-full object-cover">
        </div>
        <h3 id="matchTitle" class="text-lg font-bold text-white mb-0.5">Название</h3>
        <p id="matchMeta" class="text-xs text-slate-300 mb-4">Год, Рейтинг</p>

        <div class="flex flex-col gap-2.5 w-full max-w-xs">
            <button onclick="openPlayer(currentMatchedMovie)" class="w-full py-3.5 rounded-2xl bg-emerald-500 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">
                Смотреть прямо в Telegram ▶️
            </button>
            <button onclick="closeMatch()" class="text-xs text-slate-400 py-1">Свайпать дальше</button>
        </div>
    </div>

    <!-- ПОЛНОЭКРАННЫЙ ПЛЕЕР -->
    <div id="playerModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col w-screen h-screen">
        
        <!-- Шапка плеера -->
        <div id="playerControlsHeader" class="flex items-center justify-between p-2.5 bg-slate-950 border-b border-white/10 text-white flex-shrink-0 z-30">
            <span id="playerMovieTitle" class="text-xs font-bold truncate pr-2 max-w-[160px]">Просмотр фильма</span>
            
            <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="toggleLandscape()" id="btnRotateToggle" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold active:scale-95 flex items-center gap-1 shadow">
                    <span>⛶</span>
                    <span id="btnRotateText">Альбомный</span>
                </button>
                <button onclick="closePlayer()" class="px-3.5 py-1.5 bg-rose-600 text-white rounded-xl text-xs font-bold active:scale-95">
                    ✕
                </button>
            </div>
        </div>

        <!-- Контейнер плеера KinoDivBox -->
        <div id="playerFrameWrapper" class="flex-grow w-full h-full relative bg-black flex items-center justify-center overflow-hidden">
            <iframe id="videoPlayerFrame" 
                    class="w-full h-full border-0" 
                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
                    allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const SUPABASE_URL = "https://jncyvopdxarwtqtnmfwh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_YHsJtW3rAEN3QTXaW7lxDA_5TS47IFr";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ВАШ ТОЧНЫЙ БОТ:
        const BOT_USERNAME = "hausorkinobot";

        const currentUserId = tg?.initDataUnsafe?.user?.id?.toString() || ("u_" + Math.floor(Math.random() * 100000));
        
        // Получаем код комнаты: сначала из startapp Телеграма, затем из URL
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = tg?.initDataUnsafe?.start_param || urlParams.get('room') || ("r_" + Math.floor(1000 + Math.random() * 9000));

        let allMovies = [];
        let filteredMovies = [];
        let currentIndex = 0;
        let currentGenre = "";
        let currentMatchedMovie = null;
        let isLandscape = false;
        let currentKinopoiskId = null;

        let swipedIds = new Set(JSON.parse(localStorage.getItem('mm_swiped_ids') || '[]'));
        let savedWatchlist = JSON.parse(localStorage.getItem('mm_saved_movies') || '[]');

        const KINOPOISK_IDS = {
            "рокки": 324,
            "человек-паук: возвращение домой": 690593,
            "человек-паук: вдали от дома": 1008445,
            "человек-паук: нет пути домой": 1309570,
            "мстители": 263531,
            "мстители: война бесконечности": 843649,
            "мстители: финал": 843650,
            "главный герой": 1219417,
            "дюна: часть вторая": 4444584,
            "дюна": 409424,
            "джон уик 4": 1264350,
            "джон уик": 762738,
            "константин: повелитель тьмы": 22062,
            "константин": 22062,
            "семейка крудс": 447400,
            "оппенгеймер": 4664634,
            "аватар": 251733,
            "аватар: путь воды": 505898,
            "темный рыцарь": 111543,
            "гладиатор": 474,
            "матрица": 301,
            "леон": 389,
            "бойцовский клуб": 361,
            "интерстеллар": 258687,
            "начало": 447301,
            "остров проклятых": 397667,
            "джентльмены": 1143242,
            "1+1": 535341,
            "1+1 (неприкасаемые)": 535341,
            "волк с уолл-стрит": 462682,
            "паразиты": 1043758,
            "зеленая книга": 1108577,
            "престиж": 195334,
            "побег из шоушенка": 326,
            "форрест гамп": 448,
            "криминальное чтиво": 342,
            "титаник": 2213,
            "ла-ла ленд": 841081,
            "дневник памяти": 8124,
            "до встречи с тобой": 807318,
            "амели": 341,
            "век адалин": 679486,
            "один день": 462354,
            "500 дней лета": 430482,
            "старикам тут не место": 195434,
            "достать ножи": 1188529,
            "достать ножи: стеклянная луковица": 1355135,
            "холоп": 1177699,
            "заклятие": 493236,
            "астрал": 401177,
            "сияние": 409,
            "унесённые призраками": 377
        };

        async function getExactKinopoiskId(movie) {
            if (!movie) return 301;
            const normTitle = (movie.title || '').toLowerCase().trim();
            if (KINOPOISK_IDS[normTitle]) return KINOPOISK_IDS[normTitle];
            if (movie.kp_id && String(movie.kp_id).length > 2 && Number(movie.kp_id) < 5000000) {
                return movie.kp_id;
            }

            try {
                const res = await fetch(`https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(movie.title)}&page=1`, {
                    headers: { 'X-API-KEY': '05e15730-5d36-4a7b-9cb8-1a9034ed276c' }
                });
                const data = await res.json();
                if (data.films && data.films.length > 0) {
                    return data.films[0].filmId;
                }
            } catch (e) {}

            return movie.id;
        }

        function updateWatchlistBadge() {
            document.getElementById('savedCountBadge').innerText = savedWatchlist.length;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        async function init() {
            updateWatchlistBadge();

            // Проверяем: если вход по приглашению в комнату
            const isDuo = tg?.initDataUnsafe?.start_param || urlParams.get('room');
            if (isDuo) {
                document.getElementById('soloBtn').classList.add('hidden');
                document.getElementById('inviteBtn').innerText = "👥 Вдвоём";
            } else {
                await db.from('rooms').upsert({ id: roomId });
            }

            try {
                const res = await fetch('./movies.json');
                allMovies = await res.json();
                applyGenreFilter('');
            } catch (err) {
                console.error("Ошибка загрузки:", err);
            }

            // Мгновенная синхронизация совпадения для пары через Realtime
            db.channel('room-channel')
              .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, payload => {
                  if (payload.new.matched_movie_data) {
                      showMatch(payload.new.matched_movie_data);
                  }
              }).subscribe();
        }

        function applyGenreFilter(genreKeyword) {
            currentIndex = 0;
            let list = allMovies.filter(m => !swipedIds.has(m.id.toString()));
            
            if (list.length === 0) {
                swipedIds.clear();
                localStorage.removeItem('mm_swiped_ids');
                list = [...allMovies];
            }

            if (genreKeyword) {
                list = list.filter(m => (m.genre || '').toLowerCase().includes(genreKeyword.toLowerCase()));
            }

            filteredMovies = shuffle(list);
            renderStack();
        }

        function renderStack() {
            const stack = document.getElementById('cardStack');
            stack.innerHTML = '';

            if (currentIndex >= filteredMovies.length) {
                swipedIds.clear();
                localStorage.removeItem('mm_swiped_ids');
                filteredMovies = shuffle(allMovies);
                currentIndex = 0;
            }

            const movie = filteredMovies[currentIndex];
            if (!movie) return;

            const card = document.createElement('div');
            card.id = "activeCard";
            card.className = "card absolute inset-0 bg-slate-950 rounded-3xl overflow-hidden shadow-2xl border border-white/10 flex flex-col justify-end";
            
            card.innerHTML = `
                <img src="${movie.poster_url}" 
                     alt="${movie.title}"
                     class="absolute inset-0 w-full h-full object-cover select-none pointer-events-none"
                     loading="eager"
                     onerror="this.src='https://avatars.mds.yandex.net/get-kinopoisk-image/1600647/430042eb-ee69-4818-aed0-a312400a26bf/600x900'">
                
                <div class="absolute top-3 right-3 z-20 px-2.5 py-1 bg-black/80 backdrop-blur-md rounded-xl text-emerald-400 font-black text-xs border border-white/10">
                    ⭐ ${movie.rating}
                </div>

                <div class="relative z-10 p-4 bg-gradient-to-t from-black via-black/85 to-transparent text-white pt-16">
                    <div class="flex items-baseline justify-between gap-2 mb-1">
                        <h2 class="text-base font-black leading-tight drop-shadow truncate">${movie.title}</h2>
                        <span class="text-xs font-bold text-slate-300 flex-shrink-0">${movie.year}</span>
                    </div>
                    <p id="movieDesc" class="text-[11px] text-slate-200 line-clamp-3 leading-snug drop-shadow-sm font-normal">
                        ${movie.description}
                    </p>
                </div>
            `;
            stack.appendChild(card);
            setupTouchGestures(card);
        }

        async function handleSwipe(direction) {
            if (currentIndex >= filteredMovies.length) return;
            const movie = filteredMovies[currentIndex];
            const isLike = direction === 'right';
            const card = document.getElementById('activeCard');

            if (card) {
                card.style.transform = `translateX(${isLike ? '140%' : '-140%'}) rotate(${isLike ? '20deg' : '-20deg'})`;
                card.style.opacity = '0';
            }

            swipedIds.add(movie.id.toString());
            localStorage.setItem('mm_swiped_ids', JSON.stringify(Array.from(swipedIds)));

            if (isLike) {
                if (!savedWatchlist.some(m => m.id === movie.id)) {
                    savedWatchlist.unshift(movie);
                    localStorage.setItem('mm_saved_movies', JSON.stringify(savedWatchlist));
                    updateWatchlistBadge();
                }
            }

            await db.from('swipes').insert({
                room_id: roomId,
                user_id: currentUserId,
                movie_id: movie.id.toString(),
                is_like: isLike
            });

            // Если парный режим — поиск совпадения
            if (isLike && (tg?.initDataUnsafe?.start_param || urlParams.get('room'))) {
                const { data: matches } = await db.from('swipes')
                    .select('user_id')
                    .eq('room_id', roomId)
                    .eq('movie_id', movie.id.toString())
                    .eq('is_like', true)
                    .neq('user_id', currentUserId);

                if (matches && matches.length > 0) {
                    await db.from('rooms').update({ matched_movie_data: movie }).eq('id', roomId);
                    showMatch(movie);
                    return;
                }
            }

            currentIndex++;
            setTimeout(renderStack, 180);
        }

        function openSoloWatchlist() {
            const list = document.getElementById('watchlistContent');
            if (savedWatchlist.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 text-xs text-slate-400">
                        <span class="text-3xl block mb-2">💔</span>
                        Ваш список пуст.<br>
                        Смахните карточку вправо (❤️), и фильм появится здесь!
                    </div>`;
            } else {
                list.innerHTML = savedWatchlist.map((m, idx) => `
                    <div class="flex items-center justify-between p-2.5 rounded-2xl bg-slate-800 border border-white/5 gap-3">
                        <img src="${m.poster_url}" class="w-11 h-16 object-cover rounded-xl shadow-sm flex-shrink-0">
                        <div class="flex-grow min-w-0 text-white">
                            <h4 class="text-xs font-bold leading-tight truncate">${m.title}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">${m.year} • ⭐ ${m.rating}</p>
                        </div>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <button onclick='openPlayer(${JSON.stringify(m).replace(/'/g, "&apos;")})' class="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs shadow-sm active:scale-95 transition">
                                Смотреть ▶
                            </button>
                            <button onclick="removeWatchlistItem(${idx})" class="w-7 h-7 rounded-lg bg-slate-700 text-slate-300 text-xs font-bold flex items-center justify-center active:scale-90">
                                ✕
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('watchlistModal').classList.remove('hidden');
        }

        function removeWatchlistItem(idx) {
            savedWatchlist.splice(idx, 1);
            localStorage.setItem('mm_saved_movies', JSON.stringify(savedWatchlist));
            updateWatchlistBadge();
            openSoloWatchlist();
        }

        function clearAllWatchlist() {
            if (confirm("Очистить все сохранённые фильмы?")) {
                savedWatchlist = [];
                localStorage.removeItem('mm_saved_movies');
                updateWatchlistBadge();
                openSoloWatchlist();
            }
        }

        function closeSoloWatchlist() {
            document.getElementById('watchlistModal').classList.add('hidden');
        }

        function showMatch(movie) {
            currentMatchedMovie = movie;
            document.getElementById('matchPoster').src = movie.poster_url;
            document.getElementById('matchTitle').innerText = movie.title;
            document.getElementById('matchMeta').innerText = `${movie.year} • ⭐ ${movie.rating}`;
            document.getElementById('matchModal').classList.remove('hidden');
        }

        function closeMatch() {
            document.getElementById('matchModal').classList.add('hidden');
            currentIndex++;
            renderStack();
        }

        async function openPlayer(movie) {
            activeMovieTarget = movie || currentMatchedMovie;
            if (!activeMovieTarget) return;

            document.getElementById('playerMovieTitle').innerText = `${activeMovieTarget.title} (${activeMovieTarget.year})`;
            document.getElementById('playerModal').classList.remove('hidden');

            currentKinopoiskId = await getExactKinopoiskId(activeMovieTarget);
            
            const frame = document.getElementById('videoPlayerFrame');
            frame.src = `https://kinodivbox.github.io/iframe?id=${currentKinopoiskId}`;
        }

        function toggleLandscape() {
            const modal = document.getElementById('playerModal');
            const text = document.getElementById('btnRotateText');
            isLandscape = !isLandscape;

            if (isLandscape) {
                modal.classList.add('cinema-landscape');
                text.innerText = "Книжный";
            } else {
                modal.classList.remove('cinema-landscape');
                text.innerText = "Альбомный";
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            modal.classList.remove('cinema-landscape');
            isLandscape = false;
            document.getElementById('btnRotateText').innerText = "Альбомный";
            modal.classList.add('hidden');
            document.getElementById('videoPlayerFrame').src = 'about:blank';
        }

        function toggleDescription() {
            const desc = document.getElementById('movieDesc');
            if (desc) desc.classList.toggle('line-clamp-3');
        }

        // ШЕРИНГ: ГАРАНТИРОВАННО ОТКРЫВАЕТ МИНИ-АПП ВНУТРИ TELEGRAM БЕЗ ВЫХОДА В БРАУЗЕР!
        function shareRoom() {
            // Формируем официальный deep-link Telegram Mini App
            const tgAppUrl = `https://t.me/${BOT_USERNAME}/app?startapp=${roomId}`;
            const shareText = "Выбираем фильм на вечер прямо в Telegram! Жми 👇";
            
            if (tg) {
                // Открывает нативный список контактов Telegram для пересылки
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(tgAppUrl)}&text=${encodeURIComponent(shareText)}`);
            } else {
                navigator.clipboard.writeText(tgAppUrl);
                alert("Ссылка на комнату скопирована в буфер!");
            }
        }

        function changeGenre(genreKeyword) {
            document.querySelectorAll('.genre-btn').forEach(btn => {
                if (btn.getAttribute('data-genre') === genreKeyword) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300', 'border', 'border-white/10');
                    btn.classList.add('bg-white', 'text-slate-950', 'font-bold');
                } else {
                    btn.classList.remove('bg-white', 'text-slate-950', 'font-bold');
                    btn.classList.add('bg-slate-800', 'text-slate-300', 'border', 'border-white/10');
                }
            });

            applyGenreFilter(genreKeyword);
        }

        function setupTouchGestures(element) {
            let startX = 0;
            let currentX = 0;

            element.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
            element.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                element.style.transform = `translateX(${diff}px) rotate(${diff / 16}deg)`;
            }, {passive: true});
            element.addEventListener('touchend', () => {
                const diff = currentX - startX;
                if (diff > 80) handleSwipe('right');
                else if (diff < -80) handleSwipe('left');
                else element.style.transform = 'translateX(0) rotate(0)';
                startX = 0; currentX = 0;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
