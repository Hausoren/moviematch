<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MovieMatch</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://kinobox.tv/kinobox.min.js"></script>
    <style>
        body { touch-action: none; overflow: hidden; }
        .card { transition: transform 0.25s ease, opacity 0.25s ease; }
    </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col justify-between p-4 select-none">

    <!-- Верхняя панель -->
    <header class="w-full max-w-sm mx-auto flex flex-col gap-2 py-2 border-b border-white/10">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl">🎬</span>
                <span class="font-black text-sm tracking-tight text-white">MovieMatch</span>
            </div>
            <div id="roomBadge" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">
                Соло режим
            </div>
            <button onclick="shareRoom()" id="inviteBtn" class="text-xs font-bold text-sky-400 bg-sky-500/10 border border-sky-500/20 px-2.5 py-1 rounded-xl active:scale-95 transition">
                + Позвать пару
            </button>
        </div>

        <!-- Фильтры жанров -->
        <div class="flex items-center gap-1.5 overflow-x-auto py-1 text-[11px]">
            <button onclick="changeGenre('')" class="genre-btn px-2.5 py-1 rounded-lg bg-emerald-500 text-slate-950 font-bold whitespace-nowrap" data-genre="">Все</button>
            <button onclick="changeGenre('35')" class="genre-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 whitespace-nowrap" data-genre="35">Комедии</button>
            <button onclick="changeGenre('878')" class="genre-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 whitespace-nowrap" data-genre="878">Фантастика</button>
            <button onclick="changeGenre('53')" class="genre-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 whitespace-nowrap" data-genre="53">Триллеры</button>
            <button onclick="changeGenre('28')" class="genre-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 whitespace-nowrap" data-genre="28">Боевики</button>
            <button onclick="changeGenre('27')" class="genre-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 whitespace-nowrap" data-genre="27">Ужасы</button>
        </div>
    </header>

    <!-- Стек карточек для свайпов -->
    <main class="relative w-full max-w-sm h-[510px] mx-auto flex items-center justify-center my-auto">
        <div id="cardStack" class="relative w-full h-full">
            <div id="loader" class="absolute inset-0 flex items-center justify-center text-slate-500 text-xs animate-pulse">
                Загрузка фильмов...
            </div>
        </div>
    </main>

    <!-- Кнопки управления -->
    <footer class="w-full max-w-sm mx-auto flex items-center justify-center gap-6 py-2">
        <button onclick="handleSwipe('left')" class="w-14 h-14 rounded-full bg-slate-900 border border-rose-500/30 text-rose-400 flex items-center justify-center text-2xl shadow-lg active:scale-90 transition">
            ✕
        </button>
        <button onclick="toggleDescription()" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 text-slate-400 flex items-center justify-center text-sm shadow active:scale-90 transition">
            ℹ️
        </button>
        <button onclick="handleSwipe('right')" class="w-14 h-14 rounded-full bg-slate-900 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-2xl shadow-lg active:scale-90 transition">
            ❤️
        </button>
    </footer>

    <!-- ЭКРАН СОВПАДЕНИЯ (MATCH) -->
    <div id="matchModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-40 hidden flex flex-col items-center justify-center p-6 text-center">
        <div class="animate-bounce text-5xl mb-1">🎉</div>
        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 mb-1">
            IT’S A MATCH!
        </h2>
        <p class="text-xs text-slate-400 mb-4">Вы оба хотите посмотреть:</p>

        <img id="matchPoster" src="" class="w-40 h-60 object-cover rounded-2xl shadow-2xl mb-3 border border-white/10">
        <h3 id="matchTitle" class="text-xl font-bold text-white mb-1">Название</h3>
        <p id="matchMeta" class="text-xs text-slate-400 mb-6">Год, Рейтинг</p>

        <div class="flex flex-col gap-3 w-full max-w-xs">
            <button onclick="openPlayer()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">
                Смотреть прямо в Telegram ▶️
            </button>
            <button onclick="closeMatch()" class="text-xs text-slate-500 py-2">Свайпать дальше</button>
        </div>
    </div>

    <!-- ВСТРОЕННЫЙ БЕСПЛАТНЫЙ ПЛЕЕР -->
    <div id="playerModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="flex items-center justify-between p-3 bg-slate-900/90 border-b border-white/10">
            <span id="playerMovieTitle" class="text-xs font-bold text-slate-200 truncate pr-2">Просмотр фильма</span>
            <button onclick="closePlayer()" class="px-3 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold active:scale-95">
                Закрыть ✕
            </button>
        </div>
        <div class="flex-grow w-full h-full relative">
            <div class="kinobox_player w-full h-full"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const SUPABASE_URL = "https://jncyvopdxarwtqtnmfwh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_YHsJtW3rAEN3QTXaW7lxDA_5TS47IFr";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUserId = tg?.initDataUnsafe?.user?.id?.toString() || ("u_" + Math.floor(Math.random() * 100000));
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ("r_" + Math.floor(1000 + Math.random() * 9000));

        let allMovies = [];
        let filteredMovies = [];
        let currentIndex = 0;
        let currentMatchedMovie = null;

        async function init() {
            if (urlParams.get('room')) {
                document.getElementById('roomBadge').innerText = "Комната: " + roomId;
                document.getElementById('inviteBtn').innerText = "🔗 Поделиться";
            } else {
                await db.from('rooms').upsert({ id: roomId });
            }

            // Загружаем базу со своего же сайта (БЕЗ блокировок провайдеров!)
            try {
                const res = await fetch('./movies.json');
                allMovies = await res.json();
                filteredMovies = [...allMovies];
                renderStack();
            } catch (err) {
                document.getElementById('cardStack').innerHTML = `<div class="h-full flex items-center justify-center text-xs text-red-400">Ошибка загрузки файла movies.json</div>`;
            }

            // Слушаем совпадения в комнате
            db.channel('room-channel')
              .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, payload => {
                  if (payload.new.matched_movie_data) {
                      showMatch(payload.new.matched_movie_data);
                  }
              }).subscribe();
        }

        function renderStack() {
            const stack = document.getElementById('cardStack');
            stack.innerHTML = '';

            if (currentIndex >= filteredMovies.length) {
                stack.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6">
                        <span class="text-4xl mb-2">🎬</span>
                        <p class="text-sm font-bold text-white mb-1">Все фильмы просмотрены!</p>
                        <p class="text-xs text-slate-400 mb-4">Ждем ответных свайпов второго игрока.</p>
                        <button onclick="currentIndex=0;renderStack()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-sky-400">Начать сначала</button>
                    </div>`;
                return;
            }

            const movie = filteredMovies[currentIndex];
            const card = document.createElement('div');
            card.id = "activeCard";
            card.className = "card absolute inset-0 bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col";
            card.innerHTML = `
                <div class="relative w-full h-[370px]">
                    <img src="${movie.poster_url}" class="w-full h-full object-cover">
                    <div class="absolute top-3 right-3 px-2 py-1 bg-black/60 backdrop-blur-md rounded-xl text-emerald-400 font-bold text-xs border border-white/10">
                        ⭐ ${movie.rating}
                    </div>
                </div>
                <div class="p-4 flex-grow flex flex-col justify-between bg-gradient-to-t from-slate-950 to-slate-900">
                    <div>
                        <h2 class="text-base font-black text-white leading-tight">${movie.title}</h2>
                        <p class="text-xs text-slate-400 mt-0.5">${movie.year}</p>
                    </div>
                    <p id="movieDesc" class="text-[11px] text-slate-300 line-clamp-2 mt-2 leading-relaxed">
                        ${movie.description}
                    </p>
                </div>
            `;
            stack.appendChild(card);
            setupTouchGestures(card);
        }

        async function handleSwipe(direction) {
            if (currentIndex >= filteredMovies.length) return;
            const movie = filteredMovies[currentIndex];
            const isLike = direction === 'right';
            const card = document.getElementById('activeCard');

            if (card) {
                card.style.transform = `translateX(${isLike ? '150%' : '-150%'}) rotate(${isLike ? '25deg' : '-25deg'})`;
                card.style.opacity = '0';
            }

            // Запись в Supabase
            await db.from('swipes').insert({
                room_id: roomId,
                user_id: currentUserId,
                movie_id: movie.id,
                is_like: isLike
            });

            if (isLike) {
                const { data: matches } = await db.from('swipes')
                    .select('user_id')
                    .eq('room_id', roomId)
                    .eq('movie_id', movie.id)
                    .eq('is_like', true)
                    .neq('user_id', currentUserId);

                if (matches && matches.length > 0) {
                    await db.from('rooms').update({ matched_movie_data: movie }).eq('id', roomId);
                    showMatch(movie);
                    return;
                }
            }

            currentIndex++;
            setTimeout(renderStack, 200);
        }

        function showMatch(movie) {
            currentMatchedMovie = movie;
            document.getElementById('matchPoster').src = movie.poster_url;
            document.getElementById('matchTitle').innerText = movie.title;
            document.getElementById('matchMeta').innerText = `${movie.year} • ⭐ ${movie.rating}`;
            document.getElementById('playerMovieTitle').innerText = `${movie.title} (${movie.year})`;

            document.getElementById('matchModal').classList.remove('hidden');
        }

        function closeMatch() {
            document.getElementById('matchModal').classList.add('hidden');
            currentIndex++;
            renderStack();
        }

        function openPlayer() {
            if (!currentMatchedMovie) return;
            document.getElementById('playerModal').classList.remove('hidden');
            
            // Запуск плеера по ID Кинопоиска
            new Kinobox('.kinobox_player', {
                search: { kinopoisk: currentMatchedMovie.kp_id || currentMatchedMovie.id }
            }).init();
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.add('hidden');
            document.querySelector('.kinobox_player').innerHTML = '';
        }

        function toggleDescription() {
            const desc = document.getElementById('movieDesc');
            if (desc) desc.classList.toggle('line-clamp-2');
        }

        function shareRoom() {
            const shareUrl = window.location.origin + window.location.pathname + `?room=${roomId}`;
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent("Выбираем фильм на вечер! Заходи со мной свайпать:")}`);
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert("Ссылка на комнату скопирована!");
            }
        }

        function changeGenre(genreId) {
            currentIndex = 0;
            if (!genreId) {
                filteredMovies = [...allMovies];
            } else {
                filteredMovies = allMovies.filter(m => m.genre_id === genreId);
            }

            document.querySelectorAll('.genre-btn').forEach(btn => {
                if (btn.getAttribute('data-genre') === genreId) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300');
                    btn.classList.add('bg-emerald-500', 'text-slate-950', 'font-bold');
                } else {
                    btn.classList.remove('bg-emerald-500', 'text-slate-950', 'font-bold');
                    btn.classList.add('bg-slate-800', 'text-slate-300');
                }
            });

            renderStack();
        }

        function setupTouchGestures(element) {
            let startX = 0;
            let currentX = 0;

            element.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
            element.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                element.style.transform = `translateX(${diff}px) rotate(${diff / 15}deg)`;
            });
            element.addEventListener('touchend', () => {
                const diff = currentX - startX;
                if (diff > 90) handleSwipe('right');
                else if (diff < -90) handleSwipe('left');
                else element.style.transform = 'translateX(0) rotate(0)';
                startX = 0; currentX = 0;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
