<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MovieMatch</title>
    <meta name="referrer" content="no-referrer">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://kinobox.tv/kinobox.min.js"></script>
    <style>
        body { touch-action: none; overflow: hidden; }
        .card { transition: transform 0.22s ease-out, opacity 0.22s ease-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between p-3 select-none font-sans">

    <!-- Верхняя панель -->
    <header class="w-full max-w-sm mx-auto flex flex-col gap-2.5 pt-1 pb-2 border-b border-slate-200">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
                <span class="text-2xl">🍿</span>
                <span class="font-black text-base tracking-tight text-slate-900">MovieMatch</span>
            </div>
            
            <!-- Кнопка Соло-режима и сохраненных фильмов -->
            <button onclick="openSoloWatchlist()" id="soloBtn" class="text-xs font-bold px-3 py-2 rounded-2xl bg-white border border-slate-300 shadow-sm text-slate-800 active:scale-95 transition flex items-center gap-1.5">
                <span>👤 Соло:</span>
                <span class="text-emerald-600 font-extrabold flex items-center gap-1">
                    ⭐ <span id="savedCountBadge">0</span>
                </span>
            </button>

            <!-- Кнопка создания комнаты для пары -->
            <button onclick="shareRoom()" id="inviteBtn" class="text-xs font-bold text-white bg-indigo-600 px-3.5 py-2 rounded-2xl shadow-md shadow-indigo-200 active:scale-95 transition">
                + Вдвоём
            </button>
        </div>

        <!-- Увеличенные и расширенные кнопки жанров -->
        <div class="flex items-center gap-2 overflow-x-auto py-1 text-xs no-scrollbar">
            <button onclick="changeGenre('')" class="genre-btn px-4 py-2 rounded-2xl bg-slate-900 text-white font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="">🎲 Все подряд</button>
            <button onclick="changeGenre('мелодрама')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="мелодрама">❤️ Про любовь</button>
            <button onclick="changeGenre('комедия')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="комедия">😂 Комедии</button>
            <button onclick="changeGenre('фантастика')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="фантастика">🚀 Фантастика</button>
            <button onclick="changeGenre('триллер')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="триллер">🔪 Триллеры</button>
            <button onclick="changeGenre('боевик')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="боевик">💥 Боевики</button>
            <button onclick="changeGenre('драма')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="драма">🎭 Драмы</button>
            <button onclick="changeGenre('криминал')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="криминал">🔫 Криминал</button>
            <button onclick="changeGenre('детектив')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="детектив">🕵️ Детективы</button>
            <button onclick="changeGenre('ужасы')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="ужасы">👻 Ужасы</button>
            <button onclick="changeGenre('приключения')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="приключения">🏰 Приключения</button>
            <button onclick="changeGenre('мультфильм')" class="genre-btn px-4 py-2 rounded-2xl bg-white border border-slate-300 text-slate-800 font-bold whitespace-nowrap shadow-sm transition active:scale-95" data-genre="мультфильм">🍿 Мультфильмы</button>
        </div>
    </header>

    <!-- Стек карточек -->
    <main class="relative w-full max-w-sm h-[480px] mx-auto flex items-center justify-center my-auto">
        <div id="cardStack" class="relative w-full h-full">
            <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 text-xs">
                <span class="text-3xl mb-2 animate-bounce">🎬</span>
                <span>Загружаем каталог фильмов...</span>
            </div>
        </div>
    </main>

    <!-- Кнопки управления (Оставлены без изменений) -->
    <footer class="w-full max-w-sm mx-auto flex items-center justify-center gap-8 py-2">
        <button onclick="handleSwipe('left')" class="w-16 h-16 rounded-full bg-white border-2 border-rose-200 text-rose-500 flex items-center justify-center text-3xl shadow-xl shadow-rose-100 active:scale-90 transition">
            ✕
        </button>
        <button onclick="toggleDescription()" class="w-12 h-12 rounded-full bg-white border border-slate-300 text-slate-600 flex items-center justify-center text-lg shadow-md active:scale-90 transition">
            ℹ️
        </button>
        <button onclick="handleSwipe('right')" class="w-16 h-16 rounded-full bg-emerald-500 text-white flex items-center justify-center text-3xl shadow-xl shadow-emerald-200 active:scale-90 transition">
            ❤️
        </button>
    </footer>

    <!-- ЭКРАН СОЛО-РЕЖИМА: МОЙ СПИСОК ФИЛЬМОВ -->
    <div id="watchlistModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-3xl p-5 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                <div>
                    <h3 class="text-lg font-black text-slate-900">⭐ Мой список («Буду смотреть»)</h3>
                    <p class="text-xs text-slate-400">Фильмы, которые вы смахнули вправо в Соло-режиме</p>
                </div>
                <button onclick="closeSoloWatchlist()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 text-sm font-bold">✕</button>
            </div>
            
            <div id="watchlistContent" class="overflow-y-auto space-y-3 flex-grow no-scrollbar pr-1">
                <!-- Сохраненные фильмы -->
            </div>
        </div>
    </div>

    <!-- ЭКРАН СОВПАДЕНИЯ (MATCH ВДВОЁМ) -->
    <div id="matchModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-6 text-center text-white">
        <div class="text-5xl mb-1 animate-bounce">🎉</div>
        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 mb-1">
            IT’S A MATCH!
        </h2>
        <p class="text-xs text-slate-300 mb-4">Вы оба выбрали этот фильм:</p>

        <img id="matchPoster" src="" class="w-44 h-64 object-cover rounded-2xl shadow-2xl mb-3 border border-white/20">
        <h3 id="matchTitle" class="text-xl font-bold text-white mb-1">Название</h3>
        <p id="matchMeta" class="text-xs text-slate-300 mb-6">Год, Рейтинг</p>

        <div class="flex flex-col gap-3 w-full max-w-xs">
            <button onclick="openPlayer(currentMatchedMovie)" class="w-full py-3.5 rounded-2xl bg-emerald-500 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">
                Смотреть прямо в Telegram ▶️
            </button>
            <button onclick="closeMatch()" class="text-xs text-slate-400 py-2">Свайпать дальше</button>
        </div>
    </div>

    <!-- ВСТРОЕННЫЙ БЕСПЛАТНЫЙ ПЛЕЕР -->
    <div id="playerModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="flex items-center justify-between p-3 bg-slate-900 border-b border-white/10 text-white">
            <span id="playerMovieTitle" class="text-xs font-bold truncate pr-2">Просмотр фильма</span>
            <button onclick="closePlayer()" class="px-3 py-1 bg-slate-800 text-slate-200 rounded-lg text-xs font-bold active:scale-95">
                Закрыть ✕
            </button>
        </div>
        <div class="flex-grow w-full h-full relative">
            <div class="kinobox_player w-full h-full"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const SUPABASE_URL = "https://jncyvopdxarwtqtnmfwh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_YHsJtW3rAEN3QTXaW7lxDA_5TS47IFr";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUserId = tg?.initDataUnsafe?.user?.id?.toString() || ("u_" + Math.floor(Math.random() * 100000));
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ("r_" + Math.floor(1000 + Math.random() * 9000));

        let allMovies = [];
        let filteredMovies = [];
        let currentIndex = 0;
        let currentMatchedMovie = null;
        let savedWatchlist = JSON.parse(localStorage.getItem('mm_saved_movies') || '[]');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function updateWatchlistBadge() {
            document.getElementById('savedCountBadge').innerText = savedWatchlist.length;
        }

        async function init() {
            updateWatchlistBadge();

            if (urlParams.get('room')) {
                document.getElementById('soloBtn').classList.add('hidden');
                document.getElementById('inviteBtn').innerText = "🔗 Ссылка пары";
            } else {
                await db.from('rooms').upsert({ id: roomId });
            }

            try {
                const res = await fetch('./movies.json');
                allMovies = await res.json();
                filteredMovies = shuffle(allMovies);
                renderStack();
            } catch (err) {
                document.getElementById('cardStack').innerHTML = `<div class="h-full flex items-center justify-center text-xs text-red-500">Ошибка загрузки базы фильмов</div>`;
            }

            // Подписка на совпадения для пары
            db.channel('room-channel')
              .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, payload => {
                  if (payload.new.matched_movie_data) {
                      showMatch(payload.new.matched_movie_data);
                  }
              }).subscribe();
        }

        function renderStack() {
            const stack = document.getElementById('cardStack');
            stack.innerHTML = '';

            if (currentIndex >= filteredMovies.length) {
                stack.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 bg-white rounded-3xl shadow-xl border border-slate-200">
                        <span class="text-4xl mb-2">🎉</span>
                        <p class="text-base font-bold text-slate-900 mb-1">Вы просмотрели всю подборку!</p>
                        <p class="text-xs text-slate-500 mb-4">Нажмите кнопку, чтобы перемешать фильмы заново в случайном порядке.</p>
                        <button onclick="currentIndex=0;filteredMovies=shuffle(filteredMovies);renderStack()" class="px-5 py-2.5 rounded-2xl bg-slate-900 text-white font-bold text-xs shadow-md active:scale-95 transition">
                            Перемешать заново 🔄
                        </button>
                    </div>`;
                return;
            }

            const movie = filteredMovies[currentIndex];
            const card = document.createElement('div');
            card.id = "activeCard";
            card.className = "card absolute inset-0 bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-200/90 flex flex-col";
            card.innerHTML = `
                <div class="relative w-full h-[320px] bg-slate-200 flex items-center justify-center overflow-hidden">
                    <img src="${movie.poster_url}" 
                         alt="${movie.title}"
                         class="w-full h-full object-cover select-none pointer-events-none"
                         loading="eager"
                         onerror="this.parentElement.innerHTML='<div class=\\'flex flex-col items-center justify-center h-full text-slate-400 p-4 text-center\\'><span class=\\'text-5xl mb-2\\'>🎬</span><span class=\\'font-black text-slate-800 text-sm\\'>${movie.title}</span><span class=\\'text-xs\\'>${movie.year}</span></div>'">
                    <div class="absolute top-3 right-3 px-2.5 py-1 bg-white/95 backdrop-blur-md rounded-xl text-slate-900 font-black text-xs shadow-md border border-slate-200">
                        ⭐ ${movie.rating}
                    </div>
                </div>
                <div class="p-4 flex-grow flex flex-col justify-between bg-white">
                    <div>
                        <div class="flex items-baseline justify-between gap-2">
                            <h2 class="text-base font-black text-slate-900 leading-tight">${movie.title}</h2>
                            <span class="text-xs font-semibold text-slate-400">${movie.year}</span>
                        </div>
                        <p class="text-[11px] font-bold text-indigo-600 mt-0.5">${movie.genre || ''}</p>
                    </div>
                    <p id="movieDesc" class="text-[11px] text-slate-600 line-clamp-2 leading-relaxed">
                        ${movie.description}
                    </p>
                </div>
            `;
            stack.appendChild(card);
            setupTouchGestures(card);
        }

        async function handleSwipe(direction) {
            if (currentIndex >= filteredMovies.length) return;
            const movie = filteredMovies[currentIndex];
            const isLike = direction === 'right';
            const card = document.getElementById('activeCard');

            if (card) {
                card.style.transform = `translateX(${isLike ? '140%' : '-140%'}) rotate(${isLike ? '20deg' : '-20deg'})`;
                card.style.opacity = '0';
            }

            // В Соло-режиме: лайкнутые фильмы автоматически сохраняются в "Мой список"
            if (isLike) {
                if (!savedWatchlist.some(m => m.id === movie.id)) {
                    savedWatchlist.unshift(movie);
                    localStorage.setItem('mm_saved_movies', JSON.stringify(savedWatchlist));
                    updateWatchlistBadge();
                }
            }

            // Запись в общую базу
            await db.from('swipes').insert({
                room_id: roomId,
                user_id: currentUserId,
                movie_id: movie.id.toString(),
                is_like: isLike
            });

            // Если парный режим — поиск совпадения
            if (isLike && urlParams.get('room')) {
                const { data: matches } = await db.from('swipes')
                    .select('user_id')
                    .eq('room_id', roomId)
                    .eq('movie_id', movie.id.toString())
                    .eq('is_like', true)
                    .neq('user_id', currentUserId);

                if (matches && matches.length > 0) {
                    await db.from('rooms').update({ matched_movie_data: movie }).eq('id', roomId);
                    showMatch(movie);
                    return;
                }
            }

            currentIndex++;
            setTimeout(renderStack, 180);
        }

        // Соло-режим: просмотр сохранённых фильмов
        function openSoloWatchlist() {
            const list = document.getElementById('watchlistContent');
            if (savedWatchlist.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 text-xs text-slate-400">
                        <span class="text-3xl block mb-2">💔</span>
                        Вы пока не лайкнули ни одного фильма.<br>
                        Свайпайте карточки вправо (❤️), и они появятся здесь!
                    </div>`;
            } else {
                list.innerHTML = savedWatchlist.map(m => `
                    <div class="flex items-center justify-between p-2.5 rounded-2xl bg-slate-50 border border-slate-200/80 gap-3">
                        <img src="${m.poster_url}" class="w-12 h-16 object-cover rounded-xl shadow-sm" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=200'">
                        <div class="flex-grow">
                            <h4 class="text-xs font-bold text-slate-900 leading-tight">${m.title}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">${m.year} • ⭐ ${m.rating}</p>
                            <span class="text-[9px] text-indigo-600 font-semibold">${m.genre || ''}</span>
                        </div>
                        <button onclick='openPlayer(${JSON.stringify(m).replace(/'/g, "&apos;")})' class="px-3.5 py-2 rounded-xl bg-emerald-500 text-white font-bold text-xs shadow-sm active:scale-95 transition">
                            Смотреть ▶
                        </button>
                    </div>
                `).join('');
            }
            document.getElementById('watchlistModal').classList.remove('hidden');
        }

        function closeSoloWatchlist() {
            document.getElementById('watchlistModal').classList.add('hidden');
        }

        function showMatch(movie) {
            currentMatchedMovie = movie;
            document.getElementById('matchPoster').src = movie.poster_url;
            document.getElementById('matchTitle').innerText = movie.title;
            document.getElementById('matchMeta').innerText = `${movie.year} • ${movie.genre} • ⭐ ${movie.rating}`;
            document.getElementById('matchModal').classList.remove('hidden');
        }

        function closeMatch() {
            document.getElementById('matchModal').classList.add('hidden');
            currentIndex++;
            renderStack();
        }

        function openPlayer(movie) {
            const target = movie || currentMatchedMovie;
            if (!target) return;

            document.getElementById('playerMovieTitle').innerText = `${target.title} (${target.year})`;
            document.getElementById('playerModal').classList.remove('hidden');
            
            new Kinobox('.kinobox_player', {
                search: { 
                    kinopoisk: target.kp_id || target.id,
                    title: target.title
                }
            }).init();
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.add('hidden');
            document.querySelector('.kinobox_player').innerHTML = '';
        }

        function toggleDescription() {
            const desc = document.getElementById('movieDesc');
            if (desc) desc.classList.toggle('line-clamp-2');
        }

        function shareRoom() {
            const shareUrl = window.location.origin + window.location.pathname + `?room=${roomId}`;
            if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent("Выбираем фильм на вечер! Заходи со мной свайпать:")}`);
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert("Ссылка на комнату скопирована в буфер!");
            }
        }

        function changeGenre(genreKeyword) {
            currentIndex = 0;
            if (!genreKeyword) {
                filteredMovies = shuffle(allMovies);
            } else {
                filteredMovies = shuffle(allMovies.filter(m => (m.genre || '').toLowerCase().includes(genreKeyword.toLowerCase())));
            }

            document.querySelectorAll('.genre-btn').forEach(btn => {
                if (btn.getAttribute('data-genre') === genreKeyword) {
                    btn.classList.remove('bg-white', 'text-slate-800', 'border', 'border-slate-300');
                    btn.classList.add('bg-slate-900', 'text-white', 'font-bold');
                } else {
                    btn.classList.remove('bg-slate-900', 'text-white', 'font-bold');
                    btn.classList.add('bg-white', 'text-slate-800', 'border', 'border-slate-300');
                }
            });

            renderStack();
        }

        function setupTouchGestures(element) {
            let startX = 0;
            let currentX = 0;

            element.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
            element.addEventListener('touchmove', e => {
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                element.style.transform = `translateX(${diff}px) rotate(${diff / 16}deg)`;
            }, {passive: true});
            element.addEventListener('touchend', () => {
                const diff = currentX - startX;
                if (diff > 80) handleSwipe('right');
                else if (diff < -80) handleSwipe('left');
                else element.style.transform = 'translateX(0) rotate(0)';
                startX = 0; currentX = 0;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
